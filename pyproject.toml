[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rivet"
version = "0.1.0"
description = "AI agent security — MCP tap, provenance graph, two-layer defense"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ollama = ["ollama>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rivet.agent" = ["fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
